name: Tests

# Runs the whole suite on Windows for every push to main and to claude/** work branches,
# and for pull requests (ADR 0003 §5: tests assume Windows, Tk and ctypes).
on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Syntax check
        shell: pwsh
        run: python -m py_compile ezBAK.py

      - name: Run pytest
        shell: pwsh
        run: python -m pytest tests -q -ra
